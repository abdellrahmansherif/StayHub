# Load .env file
spring.config.import=optional:file:.env[.properties]

spring.application.name=StayHub
server.port=8081

# Database (values come from .env)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Host verification
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB
host-verification.storage.root-dir=./private-storage
host-verification.storage.base-url=https://cdn.example.com
host-verification.ai.base-url=${AI_BASE_URL:http://localhost:8000}